<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- Hoja de calendario en pixel art, con la cara sonriente. -->
  <rect width="16" height="16" fill="#000"/>
  <rect x="1" y="1" width="14" height="4" fill="#014bc4"/>
  <rect x="1" y="5" width="14" height="10" fill="#fff"/>
  <!-- anillas -->
  <rect x="4" y="0" width="2" height="3" fill="#fff"/>
  <rect x="10" y="0" width="2" height="3" fill="#fff"/>
  <!-- ojos -->
  <rect x="5" y="7" width="1" height="2" fill="#000"/>
  <rect x="10" y="7" width="1" height="2" fill="#000"/>
  <!-- mejillas -->
  <rect x="3" y="10" width="2" height="1" fill="#f7a8c0"/>
  <rect x="11" y="10" width="2" height="1" fill="#f7a8c0"/>
  <!-- boca -->
  <rect x="6" y="10" width="1" height="1" fill="#000"/>
  <rect x="7" y="11" width="2" height="1" fill="#000"/>
  <rect x="9" y="10" width="1" height="1" fill="#000"/>
</svg>
